<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Karya | RuangKarya</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif}</style></head><body class="bg-slate-950 text-slate-100 min-h-screen"><header class="border-b border-slate-800"><div class="max-w-5xl mx-auto px-4 py-5"><a href="index.html" class="font-bold text-xl">ruang<span class="text-indigo-400">karya</span></a></div></header><main id="detail" class="max-w-4xl mx-auto px-4 py-12"></main><footer class="border-t border-slate-800 text-center text-slate-500 p-6 text-sm">© <span id="year"></span> RuangKarya</footer><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');document.querySelector('#year').textContent=new Date().getFullYear();fetch('projects.json').then(r=>r.json()).then(rows=>{const p=rows.find(x=>String(x.id)===String(id));if(!p){document.querySelector('#detail').innerHTML='<div class="text-center py-20"><div class="text-5xl mb-4">🔍</div><h1 class="text-2xl font-bold mb-4">Karya tidak ditemukan</h1><a class="text-indigo-400" href="index.html">← Kembali ke galeri</a></div>';return}document.title=p.title+' | RuangKarya';document.querySelector('#detail').innerHTML=`<a href="index.html" class="text-slate-400 hover:text-indigo-400">← Kembali ke Galeri</a><article class="mt-6 bg-slate-900/70 border border-slate-800 rounded-3xl p-6 sm:p-10"><span class="inline-block px-3 py-1 rounded-lg bg-indigo-950 text-indigo-300 text-xs mb-4">${esc(p.category)}</span><h1 class="text-3xl sm:text-4xl font-extrabold mb-6">${esc(p.title)}</h1><div class="text-sm text-slate-400 mb-7">👤 ${esc(p.student_name)} · ${esc(p.student_class)} · ${esc(p.created_at||'')}</div>${p.cover_image?`<img src="${esc(p.cover_image)}" alt="${esc(p.title)}" class="w-full max-h-[520px] object-contain bg-slate-950 rounded-2xl mb-8">`:''}<h2 class="text-xl font-bold mb-3">Tentang Karya</h2><p class="whitespace-pre-wrap leading-7 text-slate-300 mb-8">${esc(p.description)}</p><div class="flex flex-wrap gap-3">${p.demo_url?`<a target="_blank" rel="noopener noreferrer" href="${esc(p.demo_url)}" class="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500">Lihat Demo ↗</a>`:''}${p.project_url?`<a target="_blank" rel="noopener noreferrer" href="${esc(p.project_url)}" class="px-5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700">Buka Proyek ↗</a>`:''}</div></article>`}).catch(()=>document.querySelector('#detail').textContent='Data karya gagal dimuat.');</script></body></html>
